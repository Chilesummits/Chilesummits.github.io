experience:
  - role: Associate Professor
    org: Centro Bahía Lomas, Universidad Santo Tomás, Chile
    start: 2023-01-01
    summary: |
      Lead research on the population dynamics, demography, and spatial ecology of birds
      in the Magallanes Region and Chilean Patagonia. Faculty member of the PhD programme
      in Biodiversity Conservation and Management, supervising theses and teaching
      doctoral courses. University representative for the National Shorebird
      Conservation Action Plan and National Bird Conservation Strategy.
  - role: Principal Investigator
    org: Red de Observadores de Aves y Vida Silvestre de Chile (ROC)
    start: 2019-01-01
    summary: |
      Design and coordination of national-scale bird monitoring, including the long-term
      waterbird monitoring plan at Laguna Batuco, wintering censuses of Andean Goose in
      Lampa-Quilicura, and the American Oystercatcher monitoring plan at the Maipo River
      mouth. Delivered Chile's national bird monitoring plan design, commissioned by the
      Ministry of the Environment. Co-leads the ROC bird banding programme and trains new
      banders.
  - role: Postdoctoral Researcher
    org: Centro Internacional Cabo de Hornos (CHIC), Chile — Prof. Rodrigo Vásquez lab
    start: 2022-01-01
    end: 2022-12-31
    summary: |
      Population dynamics and ecology of Patagonian forest birds using the long-term
      mark-recapture dataset of Omora Ethnobotanical Park, Navarino Island.
  - role: Postdoctoral Fellow
    org: Swiss Ornithological Institute — Vogelwarte
    start: 2021-01-01
    end: 2022-06-30
    summary: |
      6-month fellowship with Dr Marc Kéry and Dr Michael Schaub. Bayesian estimation of
      species- and community-level survival from the Omora mark-recapture dataset, and
      state-space models estimating two decades of abundance change in the Ruddy-headed
      Goose in Magallanes.
  - role: Postdoctoral Researcher
    org: Instituto de Ecología y Biodiversidad (IEB), Universidad de Chile — Prof. Rodrigo Vásquez lab
    start: 2020-01-01
    end: 2022-12-31
    summary: |
      Temporal variation in the demographic and phenological parameters of forest birds
      using a 20-year banding dataset from the Omora Ethnobotanical Park, Navarino Island.
  - role: DPhil (PhD) Researcher
    org: Department of Zoology, University of Oxford
    start: 2014-01-01
    end: 2018-12-31
    summary: |
      Mark-recapture survival analysis, phylogenetic meta-analysis of insularity effects
      on avian growth, nest monitoring, and integral projection modeling of an insular
      bird population (*Zosterops lateralis*) in Queensland, Australia. Supervised by
      Prof. Tim Coulson and Prof. Sonya Clegg.

