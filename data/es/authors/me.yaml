experience:
  - role: Profesor Asociado
    org: Centro Bahía Lomas, Universidad Santo Tomás, Chile
    start: 2023-01-01
    summary: |
      Lidero investigación en dinámica poblacional, demografía y ecología espacial de
      aves en la Región de Magallanes y la Patagonia chilena. Docente del programa de
      Doctorado en Conservación y Gestión de la Biodiversidad, con guiado de tesistas y
      docencia en asignaturas del doctorado. Representante institucional ante el Plan de
      Acción Nacional para la Conservación de Aves Playeras y la Estrategia Nacional de
      Conservación de Aves.
  - role: Investigador Principal
    org: Red de Observadores de Aves y Vida Silvestre de Chile (ROC)
    start: 2019-01-01
    summary: |
      Diseño y coordinación de monitoreo de aves a escala nacional, incluyendo el plan de
      monitoreo de largo plazo de aves acuáticas en la Laguna Batuco, censos de invernada
      de Piuquén en Lampa-Quilicura y el plan de monitoreo del Pilpilén común en la
      desembocadura del río Maipo. Parte del equipo que entregó el "Diseño de un Plan
      General de Monitoreo de Aves de Chile", encargado por el Ministerio del Medio
      Ambiente. Co-lidera el programa de anillamiento de la ROC y la formación de nuevos
      anilladores.
  - role: Investigador Postdoctoral
    org: Centro Internacional Cabo de Hornos (CHIC), Chile — laboratorio del Prof. Rodrigo Vásquez
    start: 2022-01-01
    end: 2022-12-31
    summary: |
      Dinámicas poblacionales y ecología de aves de bosques de la Patagonia utilizando
      la base de datos de marca-recaptura del Parque Etnobotánico Omora, Isla Navarino.
  - role: Becario Postdoctoral
    org: Swiss Ornithological Institute — Vogelwarte
    start: 2021-01-01
    end: 2022-06-30
    summary: |
      Beca de 6 meses con el Dr. Marc Kéry y el Dr. Michael Schaub. Estimación Bayesiana
      de supervivencia a nivel específico y comunitario a partir de la base de datos de
      marca-recaptura de Omora, y modelos de espacio de estados para estimar dos décadas
      de cambio en la abundancia del Canquén Colorado en Magallanes.
  - role: Investigador Postdoctoral
    org: Instituto de Ecología y Biodiversidad (IEB), Universidad de Chile — laboratorio del Prof. Rodrigo Vásquez
    start: 2020-01-01
    end: 2022-12-31
    summary: |
      Variación temporal en parámetros demográficos y fenológicos de aves de bosque
      usando una base de datos de anillamiento de 20 años del Parque Etnobotánico Omora,
      Isla Navarino.
  - role: Investigador Doctoral (DPhil)
    org: Departamento de Zoología, University of Oxford
    start: 2014-01-01
    end: 2018-12-31
    summary: |
      Análisis de supervivencia con marca-recaptura, meta-análisis filogenético del
      efecto insular sobre el crecimiento de aves, monitoreo de nidos y modelamiento de
      proyección integral de una población insular de aves (*Zosterops lateralis*) en
      Queensland, Australia. Supervisado por el Prof. Tim Coulson y la Prof. Sonya Clegg.

